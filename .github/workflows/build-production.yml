name: Build Production Extension

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 'Create release draft'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the draft release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keeps the write-scoped token out of .git/config, where npm install scripts could read it
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install task dependencies
        working-directory: CopilotCodeReviewV1
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Install TFX CLI
        run: npm install -g tfx-cli

      - name: Package extension
        run: npm run package:prod

      - name: Get extension version
        id: version
        run: echo "version=$(jq -r '.version' vss-extension.json)" >> $GITHUB_OUTPUT

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          path: '*.vsix'
          # Uploads the .vsix itself rather than a zip; the artifact is named after the file
          archive: false
          if-no-files-found: error

      - name: Create draft release
        if: inputs.create_draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" *.vsix --draft --title "v$VERSION" --target "$GITHUB_SHA" --generate-notes
