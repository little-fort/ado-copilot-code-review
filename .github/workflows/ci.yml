name: CI

# Build verification and repo invariant tests for every PR and push to main.
# Release packaging is handled separately by build-production.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            CopilotCodeReviewV1/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install task dependencies
        working-directory: CopilotCodeReviewV1
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run invariant tests
        run: npm test

      # Packaging doubles as schema validation for vss-extension.json and both
      # task.json files — malformed manifests fail here instead of at release time.
      # The produced .vsix is discarded; build-production.yml owns release artifacts.
      - name: Validate extension packaging
        run: |
          npm install -g tfx-cli
          tfx extension create --manifest-globs vss-extension.json --output-path "$RUNNER_TEMP/ci-package"

      # NOTE: A Pester step for the PowerShell scripts will be added here once
      # the first Pester tests land (planned alongside the issue #56 fix).
